<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App Personal - ReventaPau</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .placeholder {
            background-color: #f0f0f0;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            color: #999;
            margin: 20px 0;
        }
        
        .info {
            background-color: #e8f4f8;
            padding: 15px;
            border-left: 4px solid #667eea;
            margin: 20px 0;
            border-radius: 4px;
            color: #333;
        }
        
        .info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Mi App Personal</h1>
        
        <div class="placeholder">
            <p>Aquí irá tu código HTML...</p>
        </div>
        
        <div class="info">
            <strong>✓ GitHub Pages está activo</strong><br>
            Tu aplicación está lista para funcionar en: <br>
            <strong>https://paumora.github.io/ReventaPau/</strong>
        </div>
        
        <div class="info">
            <strong>📝 Instrucciones:</strong><br>
            Solo reemplaza el contenido de este archivo con tu código HTML y la app funcionará automáticamente.
        </div>
    </div>
</body>
</html>
